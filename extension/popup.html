<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>First Short Grabber</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #0f0f0f;
        --muted: #606060;
        --line: #e0e0e0;
        --field: #f6f6f6;
        --accent: #cc0000;
        --ok: #0f7b34;
        --err: #b3261e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #181818;
          --fg: #f1f1f1;
          --muted: #aaaaaa;
          --line: #303030;
          --field: #242424;
          --accent: #ff0033;
          --ok: #5fd18a;
          --err: #ff6b61;
        }
      }

      * { box-sizing: border-box; }

      body {
        width: 340px;
        margin: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.45 system-ui, "Segoe UI", Roboto, sans-serif;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      h1 .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent);
      }

      label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin-bottom: 4px;
      }

      input[type="text"] {
        width: 100%;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--field);
        color: var(--fg);
        font: inherit;
      }
      input[type="text"]:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 9px 0;
        color: var(--muted);
        font-size: 12px;
      }
      .row input { accent-color: var(--accent); }

      button {
        width: 100%;
        padding: 9px 12px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font: 600 13px/1 inherit;
        cursor: pointer;
      }
      button:hover:not(:disabled) { filter: brightness(1.08); }
      button:disabled { opacity: 0.55; cursor: default; }

      #status {
        margin-top: 11px;
        min-height: 16px;
        font-size: 12px;
        color: var(--muted);
        word-break: break-word;
      }
      #status.ok { color: var(--ok); }
      #status.err { color: var(--err); }

      #result {
        margin-top: 8px;
        padding: 8px 9px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--field);
        font-size: 12px;
        display: none;
      }
      #result.show { display: block; }
      #result .title {
        color: var(--muted);
        margin-bottom: 3px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #result a {
        color: var(--fg);
        font-family: ui-monospace, Consolas, monospace;
        word-break: break-all;
      }

      footer {
        margin-top: 11px;
        padding-top: 9px;
        border-top: 1px solid var(--line);
        font-size: 11px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <h1><span class="dot"></span> First Short Grabber</h1>

    <label for="channel">Channel</label>
    <input
      id="channel"
      type="text"
      spellcheck="false"
      placeholder="@Clips_Edge"
    />

    <div class="row">Opens the Short, copies the URL, writes the text files.</div>

    <button id="go">Grab the first Short</button>

    <div id="status"></div>
    <div id="result">
      <div class="title" id="result-title"></div>
      <a id="result-url" href="#" target="_blank" rel="noreferrer"></a>
    </div>

    <footer id="saved-to"></footer>

    <textarea
      id="clipboard-fallback"
      aria-hidden="true"
      style="position: fixed; top: -9999px; left: -9999px; opacity: 0;"
    ></textarea>

    <script src="popup.js"></script>
  </body>
</html>
